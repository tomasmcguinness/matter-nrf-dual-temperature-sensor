# SPI NOR is not disabled here: NCS v3.2 removed CONFIG_CHIP_SPI_NOR and now
# derives CONFIG_SPI_NOR from the devicetree, and the overlay for this board
# already disables mx25r64.

CONFIG_POWEROFF=y

# Enable Watchdog
CONFIG_NCS_SAMPLE_MATTER_WATCHDOG=n

# Enable LTO to decrease the flash usage.
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
