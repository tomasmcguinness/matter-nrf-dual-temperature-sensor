# Seeed XIAO nRF52840, four probes, USB powered.
#
# Applied on top of prj.conf, which is written for the battery-powered nRF54L15 board.

# Four temperature endpoints, a wired PowerSource and no ICD Management cluster.
CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/src/zap_quad/template.zap"

CONFIG_BT_DEVICE_NAME="QuadTempSensor"

# The board defaults assume the UF2 bootloader. This build runs MCUboot with the partition
# manager layout in pm_static_xiao_ble_nrf52840.yml instead, and is flashed over SWD.
CONFIG_BUILD_OUTPUT_UF2=n

# USB powered, so it is an always-on Thread router-capable device rather than a sleepy
# end device. Readings then reach the controller as they are taken, which the heat
# calculations need: they combine probes that must be sampled at the same moment.
CONFIG_CHIP_ENABLE_ICD_SUPPORT=n
CONFIG_CHIP_ICD_LIT_SUPPORT=n
CONFIG_CHIP_ICD_UAT_SUPPORT=n
CONFIG_CHIP_ICD_REPORT_ON_ACTIVE_MODE=n
CONFIG_OPENTHREAD_NORDIC_LIBRARY_MTD=n
CONFIG_OPENTHREAD_NORDIC_LIBRARY_FTD=y
CONFIG_OPENTHREAD_MTD=n
CONFIG_OPENTHREAD_FTD=y
CONFIG_RAM_POWER_DOWN_LIBRARY=n

# Whether this board carries a 32 kHz crystal is not something to bet the radio on; the
# calibrated RC oscillator is well within what Thread and BLE need.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# The board's console and shell run over USB CDC ACM. prj.conf logs in immediate mode,
# which would write to the USB stack from whatever context logs; defer it to the log thread.
CONFIG_LOG_MODE_IMMEDIATE=n
CONFIG_LOG_MODE_DEFERRED=y

# The 2 MB QSPI flash holds the MCUboot secondary slot for Matter OTA.
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_NORDIC_QSPI_NOR_STACK_WRITE_BUFFER_SIZE=16
