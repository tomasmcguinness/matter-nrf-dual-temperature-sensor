sample:
  description: Matter Dual Temperature Sensor
  name: Matter Dual Temperature Sensor
common:
  tags:
    - sysbuild
    - ci_samples_matter
  # Only the nRF54L15 overlays describe this application's hardware (the
  # zephyr,user ADC channels, the probe divider power pins, the indicator LED
  # and the reset button), so no other board can be built.
  integration_platforms:
    - nrf54l15dk/nrf54l15/cpuapp
  platform_allow:
    - nrf54l15dk/nrf54l15/cpuapp
tests:
  sample.matter.dual_temperature_sensor.debug:
    sysbuild: true
    build_only: true
  sample.matter.dual_temperature_sensor.release:
    sysbuild: true
    build_only: true
    extra_args:
      - EXTRA_CONF_FILE=prj_release.conf
  sample.matter.dual_temperature_sensor.internal:
    sysbuild: true
    build_only: true
    extra_args:
      - FILE_SUFFIX=internal
  sample.matter.dual_temperature_sensor.release.internal:
    sysbuild: true
    build_only: true
    extra_args:
      - FILE_SUFFIX=internal
      - EXTRA_CONF_FILE=prj_release.conf
  sample.matter.dual_temperature_sensor.minewsemi:
    sysbuild: true
    build_only: true
    extra_args:
      - FILE_SUFFIX=minewsemi
  sample.matter.dual_temperature_sensor.release.minewsemi:
    sysbuild: true
    build_only: true
    extra_args:
      - FILE_SUFFIX=minewsemi
      - EXTRA_CONF_FILE=prj_release.conf
