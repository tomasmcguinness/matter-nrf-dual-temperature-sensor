# This sample uses Kconfig.defaults to set options common for all
# samples. This file should contain only options specific for this sample
# or overrides of default values.

# Enable CHIP
CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="src/chip_project_config.h"

# Configure ZAP file name
CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/src/zap/template.zap"

# 32768 == 0x8000 (example Product ID added temporaly,
# but it must be changed with proper PID from the list:
# https://github.com/project-chip/connectedhomeip/blob/482e6fd03196a6de45465a90003947ef4b86e0b1/docs/examples/discussion/PID_allocation_for_example_apps.md)
CONFIG_CHIP_DEVICE_PRODUCT_ID=32768
CONFIG_STD_CPP17=y

# Enable Matter pairing automatically on application start.
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y

# Enable Matter extended announcement and increase duration to 1 hour.
CONFIG_CHIP_BLE_EXT_ADVERTISING=y
CONFIG_CHIP_BLE_ADVERTISING_DURATION=60

# Add support for LEDs and buttons on Nordic development kits
CONFIG_DK_LIBRARY=n

# Bluetooth Low Energy configuration
CONFIG_BT_DEVICE_NAME="DualTempSensor"

# Other settings
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_CHIP_LIB_SHELL=y
CONFIG_NCS_SAMPLE_MATTER_TEST_SHELL=y

# Disable NFC onboarding
CONFIG_CHIP_NFC_ONBOARDING_PAYLOAD=n

# Enable Factory Data feature
CONFIG_CHIP_FACTORY_DATA=y
CONFIG_CHIP_FACTORY_DATA_BUILD=y

CONFIG_GPIO=y
CONFIG_ADC=y

CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_MODE_MINIMAL=n
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_RTT=y

CONFIG_CHIP_PERSISTENT_SUBSCRIPTIONS=n

CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=n

CONFIG_BT_RX_STACK_SIZE=2048

CONFIG_OPENTHREAD_DEFAULT_TX_POWER=8

# Enabling low power
CONFIG_PM_DEVICE=y

# Switch Minimal Thread Device on
CONFIG_OPENTHREAD_NORDIC_LIBRARY_MTD=y
CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_FTD=n

# Set Matter as Intermittent Connected Device
CONFIG_CHIP_ENABLE_ICD_SUPPORT=y
CONFIG_CHIP_ICD_LIT_SUPPORT=y
CONFIG_CHIP_ICD_UAT_SUPPORT=y
CONFIG_CHIP_ICD_REPORT_ON_ACTIVE_MODE=y

# How long the device stays in ActiveMode (fast polling) after it wakes, which is
# the window a client has to answer a check-in. ActiveModeThreshold only extends
# ActiveMode once something has been received, so it does not help here. The 300 ms
# default is shorter than a controller needs to resolve the node over DNS-SD and
# start CASE (~400 ms seen from the heating monitor): its Sigma1 then reached the
# parent just after the device went idle, sat there for the 300 s slow poll, and
# the session setup timed out. 2 s covers that with a few 500 ms fast polls spare,
# for a handful of extra polls per wake.
#
CONFIG_CHIP_ICD_ACTIVE_MODE_DURATION=2000

# CONFIG_CHIP_ICD_SLOW_POLL_INTERVAL defaults to 300000 (300s) once LIT support is
# on, but OpenThread's child timeout defaults to 240s. Left alone, a device that
# has been promoted to LIT operation polls its parent less often than the parent
# is willing to wait, so the parent drops the child and every idle period ends in
# a re-attach - which costs far more energy than the polling it was meant to save.
# The SIT slow poll limit (15s) masks this until a controller registers as an ICD
# client, so it only shows up once the device is in a real ecosystem.
#
# The child timeout has to outlast the polling interval with enough margin to
# survive a poll that does not get through.
#
CONFIG_OPENTHREAD_MLE_CHILD_TIMEOUT=360

# Child supervision: if nothing arrives from the parent within this many seconds,
# the child sends it a Child Update Request to check it is still attached. The
# 190s default is shorter than the 300s slow poll, and the child only hears from
# its parent when it polls, so it fired on every idle period. At 330s it only
# fires when a poll came back empty - still ahead of the parent's 360s child
# timeout, so the child can re-sync before the parent gives up on it.
#
CONFIG_OPENTHREAD_CHILD_SUPERVISION_CHECK_TIMEOUT=330

# More power saving.
CONFIG_RAM_POWER_DOWN_LIBRARY=y