CONFIG_POWEROFF=y

CONFIG_NCS_SAMPLE_MATTER_WATCHDOG=n

# Enable LTO to decrease the flash usage.
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y

# The ME54BS01 exposes no UART, and the overlay disables every UART instance,
# so the console moves to RTT.
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=y

# No shell on this board. Its only backend would be RTT, which already carries
# the log - the two cannot share a channel - and the log is the bench readout.
CONFIG_SHELL=n
CONFIG_CHIP_LIB_SHELL=n
CONFIG_NCS_SAMPLE_MATTER_TEST_SHELL=n
